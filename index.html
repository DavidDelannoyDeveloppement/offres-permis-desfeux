<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Offres DESFEUX" />
    <title>École de Conduite DESFEUX - Offres permis</title>
    <link rel="icon" type="image/png" href="./images/favicon_desfeux.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="manuelle">
    <div
      id="launch-screen"
      class="launch-screen"
      role="status"
      aria-label="Ouverture de l’application"
    >
      <div class="launch-screen__brand">
        <img
          class="launch-screen__logo"
          src="./logo-ddd.png"
          alt="David Delannoy Développement"
        />
        <div class="launch-screen__progress" aria-hidden="true">
          <span></span>
        </div>
        <div class="launch-screen__credit">
          <span>Powered by</span>
          <strong>David Delannoy Développement</strong>
        </div>
      </div>
    </div>

    <header class="hero">
      <div class="hero__inner">
        <div class="hero__brand">
          <div class="hero__logo-wrap">
            <img
              src="./images/desfeux_logo.png"
              alt="Logo École de Conduite DESFEUX"
              class="hero__logo-img"
            />
            <div class="hero__logo-fallback">AD</div>
          </div>

          <div class="hero__brand-text">
            <h1>
              <span class="h1-rouge">École</span>
              <span class="h1-orange">de Conduite</span>
              <span class="h1-vert">DESFEUX</span>
            </h1>
            <p class="hero__text">
              Catalogue complet des offres et prestations DESFEUX.
            </p>
          </div>
        </div>

        <div class="hero__controls">
          <p class="hero__controls-label">Type de boîte pour les offres B</p>
          <div class="transmission-switch" aria-label="Choix de la boîte de vitesse">
            <button
              class="transmission-switch__btn is-active"
              type="button"
              data-mode="manuelle"
            >
              Manuelle
            </button>
            <button
              class="transmission-switch__btn"
              type="button"
              data-mode="automatique"
            >
              Automatique
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <p id="catalogue-status" class="catalogue-status" aria-live="polite"></p>
      <div id="catalogue-root"></div>
      <noscript>
        <p class="catalogue-error">
          JavaScript doit être activé pour afficher le catalogue DESFEUX.
        </p>
      </noscript>
    </main>

    <script src="catalogue.js"></script>
    <script src="script.js"></script>
  </body>
</html>
